<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // Capture the requested URL before GitHub Pages serves this 404
        const url = window.location.pathname;
        
        // Don't redirect for actual static files (verification files, etc.)
        if (url && url !== '/404.html' && url !== '/') {
            // Check if it's a file (ends with .html, .json, .xml, etc.) - don't redirect those
            const isFile = url.match(/\.(html|json|xml|txt|png|jpg|jpeg|gif|svg|ico|css|js)$/);
            
            if (!isFile) {
                sessionStorage.redirect = url;
                // Redirect to index.html so React router can handle the navigation
                window.location.href = '/';
            }
        }
    </script>
    <p>Redirecting to Roials Capital...</p>
</body>
</html>
